<div class="container py-4">
  <h2 class="mb-3">Liste des événements</h2>

  <!-- Recherche -->
  <input
    type="text"
    class="form-control mb-4"
    [(ngModel)]="searchItem"
    placeholder="Rechercher un événement"
  />

  <button type="button" class="btn btn-primary" routerLink="./addEvent">
    Add New Event
  </button>

  <div class="row g-3">
    <div class="col-md-4" *ngFor="let event of filter()">
      <app-card
  [event]="event"
  (notifLike)="incLikes($event)"
  (notifBuy)="buy($event)"
></app-card>

    </div>
  </div>
</div>
